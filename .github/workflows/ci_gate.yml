name: SMP CI Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-smp:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU PyTorch and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install numpy safetensors cryptography pytest
          pip install --no-deps --no-build-isolation -e .

      - name: Run SMP v3.3 Pre-Sealing Instrument Audit
        run: python smp_core.py

      - name: Run Automated SDK and CLI Tests
        run: pytest -v
