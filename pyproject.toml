[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "starbody-core"
version = "3.3.0"
description = "Synergetic Manifold Pharmacology (SMP v3.3) Pure Emergent Metrology Engine, starbody/ Onboarding Package, Ed25519 Cartridges, SDK & CLI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "César Castro"}
]
dependencies = [
  "torch>=2.0.0",
  "safetensors>=0.4.0",
  "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
]

[project.scripts]
starbody = "starbody_cli:main"

[tool.setuptools]
packages = ["starbody"]
py-modules = ["smp_core", "starbody_sdk", "starbody_cli"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
